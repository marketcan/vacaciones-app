<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Wallet / Bag Outer Frame -->
  <g filter="url(#glow)">
    <!-- Main Body -->
    <rect x="136" y="200" width="240" height="200" rx="28" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" />
    
    <!-- Handle -->
    <path d="M196 200V152C196 118.863 222.863 92 256 92C289.137 92 316 118.863 316 152V200" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

    <!-- Horizontal Lines representing card/receipts -->
    <line x1="184" y1="272" x2="328" y2="272" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="184" y1="336" x2="272" y2="336" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
